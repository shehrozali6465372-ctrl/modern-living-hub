name: Pinterest Credential Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  credential-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install
      - run: node --check src/server.js
      - run: node --check src/credential-store.js
      - run: node --test test-credential-store.mjs
