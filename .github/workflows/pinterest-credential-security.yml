name: Pinterest Credential Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  credential-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install
      - run: node --check src/server.js
      - name: Assert no local Pinterest token vault remains
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const source = fs.readFileSync("src/server.js", "utf8");
          const forbidden = [
            "credential-store.js",
            "tokenCache",
            "getUserToken",
            "savePinterestCredential",
            "getPinterestCredential",
            "access_token in cookie"
          ];
          for (const value of forbidden) {
            if (source.includes(value)) throw new Error("forbidden local credential pattern: " + value);
          }
          if (!source.includes('"/integrations/pinterest/credentials"')) {
            throw new Error("Pinterest Agent credential ingest endpoint is not wired");
          }
          if (!source.includes("await waitForPinterestAgentReady()")) {
            throw new Error("Pinterest Agent health warm-up is not wired");
          }
          if (!source.includes("X-Credential-Ingest-Key")) {
            throw new Error("service-to-service credential authentication is not wired");
          }
          if (!source.includes("refresh_token_expires_in")) {
            throw new Error("initial Pinterest refresh-token expiry duration is not handled");
          }
          if (source.includes('app.get("/api/pinterest/accounts"')) {
            throw new Error("unauthenticated Pinterest account inventory endpoint must not be exposed");
          }
          console.log("Agent-only Pinterest credential custody and refresh-expiry invariants passed");
          NODE
