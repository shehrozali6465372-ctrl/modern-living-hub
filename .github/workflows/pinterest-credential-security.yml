name: Pinterest Credential Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  credential-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install
      - run: node --check src/server.js
      - run: node --check src/ucos-credential-client.js
      - name: Assert no local Pinterest token vault remains
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const source = fs.readFileSync("src/server.js", "utf8");
          const forbidden = [
            "credential-store.js",
            "tokenCache",
            "getUserToken",
            "savePinterestCredential",
            "getPinterestCredential",
            "access_token in cookie"
          ];
          for (const value of forbidden) {
            if (source.includes(value)) throw new Error("forbidden local credential pattern: " + value);
          }
          if (!source.includes("storePinterestCredential")) {
            throw new Error("UCOS credential vault client is not wired");
          }
          console.log("UCOS-only Pinterest credential custody invariant passed");
          NODE
